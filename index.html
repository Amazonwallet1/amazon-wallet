<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amazon Wallet</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- LOGIN PAGE -->
  <div class="login-screen" id="loginScreen" aria-label="Login Screen">
    <div class="login-box" role="form" aria-labelledby="loginTitle">
      <h1 id="loginTitle">Amazon Wallet</h1>
      <p>Secure Banking Login</p>
      <input type="password" id="password" placeholder="Enter Password" aria-label="Password" autocomplete="current-password" />
      <button id="loginBtn" aria-label="Login">Login</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard" id="dashboard" aria-label="Dashboard">
    <header class="topbar">
      <h2>Welcome, Mr Dessie</h2>
      <button class="logout-btn" id="logoutBtn" aria-label="Logout">Logout</button>
    </header>

    <!-- ACCOUNT SUMMARY -->
    <section class="summary" aria-label="Account Summary">
      <div class="atm-card" aria-label="ATM Card">
        <div class="card-top">
          <span class="chip" aria-hidden="true"></span>
          <span class="brand">Amazon Wallet</span>
        </div>
        <div class="card-number" aria-label="Card Number">**** **** **** 4587</div>
        <div class="card-info">
          <div>
            <small>Card Holder</small>
            <strong>MR DESSIE</strong>
          </div>
          <div>
            <small>Expires</small>
            <strong>02/30</strong>
          </div>
        </div>
      </div>
      <div class="balance-box" aria-label="Balance Box">
        <div class="balance-title">Available Balance</div>
        <p class="balance-amount" id="balanceAmount">2,000.00 EUR</p>
        <button class="toggle-balance" id="toggleBalanceBtn" aria-label="Toggle Balance Visibility">Hide Balance</button>
      </div>
    </section>

    <!-- ACTION BUTTONS -->
    <section class="actions" aria-label="Actions">
      <button id="withdrawBtn" aria-label="Withdraw">Withdraw</button>
      <button id="addPayeeBtn" aria-label="Add Payee">Add Payee</button>
      <button id="depositBtn" aria-label="Deposit">Deposit</button>
      <button id="transferBtn" aria-label="Transfer">Transfer</button>
      <button id="payBillsBtn" aria-label="Pay Bills">Pay Bills</button>
      <button id="contactSupportBtn" aria-label="Contact Support">Contact Support</button>
    </section>

    <!-- TRANSACTION HISTORY -->
    <section class="transactions" aria-label="Transaction History">
      <button class="toggle-history" id="toggleHistoryBtn" aria-label="Toggle Transaction History">View Transaction History</button>
      <div class="history-list hidden" id="historyList" tabindex="0">
  
        <p>✓ Successful Withdrawal by Amazon: <b>147,340.62 EUR</b></p>
      </div>
    </section>

    <!-- FORMS AREA -->
    <section class="forms" id="forms" aria-label="Forms Area"></section>
  </div>

  <script src="script.js"></script>
</body>
</html>
